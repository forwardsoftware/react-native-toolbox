name: Build & Test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test

    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        # 22 tracks the previous Node.js LTS line; pnpm/setup has no "previous LTS" alias, so bump this manually when Node.js LTS rotates
        node_version: [22, lts, latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm & Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node_version }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Build CLI
        run: pnpm run build

      - name: Test CLI commands (unit & integration)
        run: pnpm run test:integration

      - name: Test CLI commands (e2e)
        run: pnpm run test:e2e
